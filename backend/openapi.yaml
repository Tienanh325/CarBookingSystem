openapi: 3.1.0
info:
  title: GoRide API
  version: 1.3.0
  description: Complete HTTP contract for the GoRide booking, dispatch, wallet, payment, reconciliation, and administration API.
  license: { name: MIT, identifier: MIT }
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - { name: Catalog, description: "Public service and vehicle catalog" }
  - { name: Auth, description: "Registration, login, token rotation, and logout" }
  - { name: Notifications, description: "In-app inbox and Web Push subscriptions" }
  - { name: Safety, description: "Emergency contacts, SOS, ride sharing, masked contact, and ride chat" }
  - { name: Support, description: "Customer/driver support tickets and staff workflow" }
  - { name: Customers, description: "Customer profiles and saved addresses" }
  - { name: Drivers, description: "Driver onboarding, availability, location, and ride workflow" }
  - { name: Rides, description: "Ride estimates, bookings, history, invoices, cancellation, and rating" }
  - { name: Maps, description: "Geocoding and reverse-geocoding facade" }
  - { name: Wallets, description: "Customer and driver balances, top-ups, withdrawals, and ledger entries" }
  - { name: Payments, description: "Ride payments, VietQR notifications, and refunds" }
  - { name: Promotions, description: "Promotion validation" }
  - { name: Pricing, description: "Pricing and surcharge configuration" }
  - { name: Admin, description: "Role-controlled operations, finance, reconciliation, and review queues" }

paths:
  /api/vehicle-types:
    get:
      tags: [Catalog]
      operationId: listVehicleTypes
      summary: List active vehicle types
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/register:
    post:
      tags: [Auth]
      operationId: registerCustomer
      summary: Register a customer account
      security: []
      requestBody: { $ref: '#/components/requestBodies/Register' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with phone and password
      security: []
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Request a one-time password reset token
      description: Always returns an accepted response to avoid account enumeration. Non-production responses include the token for local testing; production delivery uses the configured webhook.
      security: []
      requestBody: { $ref: '#/components/requestBodies/ForgotPassword' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Consume a reset token and replace the password
      description: Tokens are single-use. A successful reset revokes every existing session for the account.
      security: []
      requestBody: { $ref: '#/components/requestBodies/ResetPassword' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/send-otp:
    post:
      tags: [Auth]
      operationId: sendOtp
      summary: Request a login OTP
      description: The current implementation returns 503 until an SMS provider is configured.
      security: []
      requestBody: { $ref: '#/components/requestBodies/SendOtp' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/verify-otp:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Verify a login OTP
      description: The current implementation returns 503 until an SMS provider is configured.
      security: []
      requestBody: { $ref: '#/components/requestBodies/VerifyOtp' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/refresh-token:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: Rotate a refresh token and issue a new access token
      security: []
      requestBody: { $ref: '#/components/requestBodies/RefreshToken' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the authenticated session
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/customers/me:
    get:
      tags: [Customers]
      operationId: getCustomerProfile
      summary: Get the current customer profile
      description: Roles CUSTOMER or ADMIN.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Customers]
      operationId: updateCustomerProfile
      summary: Update the current customer profile
      description: Roles CUSTOMER or ADMIN.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/CustomerUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/customers/me/addresses:
    get:
      tags: [Customers]
      operationId: listCustomerAddresses
      summary: List saved addresses
      description: Roles CUSTOMER or ADMIN.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Customers]
      operationId: createCustomerAddress
      summary: Add a saved address
      description: Roles CUSTOMER or ADMIN.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/AddressCreate' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/customers/me/addresses/{id}:
    delete:
      tags: [Customers]
      operationId: deleteCustomerAddress
      summary: Delete a saved address
      description: Roles CUSTOMER or ADMIN; ownership is enforced.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/customers/me/wallet:
    get:
      tags: [Wallets]
      operationId: getCustomerWallet
      summary: Get customer balances and ledger history
      description: Roles CUSTOMER or ADMIN. Balances include available, held, pending settlement, and platform receivable buckets.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/customers/me/wallet/top-ups:
    post:
      tags: [Wallets]
      operationId: createCustomerWalletTopUp
      summary: Create a VietQR wallet top-up
      description: Roles CUSTOMER or ADMIN.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TopUpCreate' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/drivers/register:
    post:
      tags: [Drivers]
      operationId: registerDriverProfile
      summary: Register a driver profile and initial vehicle
      description: Any authenticated account may register; duplicate profiles are rejected.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/DriverRegister' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/drivers/me:
    get:
      tags: [Drivers]
      operationId: getDriverProfile
      summary: Get the current driver profile
      description: Roles DRIVER or ADMIN.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Drivers]
      operationId: updateDriverProfile
      summary: Update driver identity details
      description: Roles DRIVER or ADMIN.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/DriverUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/drivers/me/online:
    post:
      tags: [Drivers]
      operationId: setDriverOnline
      summary: Set the current driver online
      description: Roles DRIVER or ADMIN. Requires an approved profile, approved vehicle, and fresh GPS location.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/drivers/me/offline:
    post:
      tags: [Drivers]
      operationId: setDriverOffline
      summary: Set the current driver offline
      description: Roles DRIVER or ADMIN; a busy driver cannot go offline.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/drivers/me/location:
    post:
      tags: [Drivers]
      operationId: updateDriverLocation
      summary: Update the current driver GPS location
      description: Roles DRIVER or ADMIN.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/LocationUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/drivers/me/ride-requests:
    get:
      tags: [Drivers]
      operationId: listDriverRideRequests
      summary: List active ride offers for the current driver
      description: Roles DRIVER or ADMIN.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/drivers/me/earnings:
    get:
      tags: [Drivers]
      operationId: getDriverEarnings
      summary: Get current driver earnings summary
      description: Roles DRIVER or ADMIN.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/drivers/me/wallet:
    get:
      tags: [Wallets]
      operationId: getDriverWallet
      summary: Get driver wallet buckets and ledger history
      description: Roles DRIVER or ADMIN.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/drivers/me/withdrawals:
    post:
      tags: [Wallets]
      operationId: createDriverWithdrawal
      summary: Create a driver withdrawal request
      description: Roles DRIVER or ADMIN; the amount is held until review.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/WithdrawalCreate' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/drivers/rides/{id}/accept:
    post:
      tags: [Drivers]
      operationId: acceptRideOffer
      summary: Accept an active ride offer
      description: Roles DRIVER or ADMIN.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RideId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/drivers/rides/{id}/reject:
    post:
      tags: [Drivers]
      operationId: rejectRideOffer
      summary: Reject an active ride offer
      description: Roles DRIVER or ADMIN.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RideId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/drivers/rides/{id}/heading:
    post:
      tags: [Drivers]
      operationId: markDriverHeadingToPickup
      summary: Mark the assigned driver as heading to pickup
      description: Roles DRIVER or ADMIN.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RideId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/drivers/rides/{id}/arrived:
    post:
      tags: [Drivers]
      operationId: markDriverArrived
      summary: Mark the assigned driver as arrived
      description: Roles DRIVER or ADMIN.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RideId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/drivers/rides/{id}/start:
    post:
      tags: [Drivers]
      operationId: startRide
      summary: Verify the customer PIN and start the ride
      description: Roles DRIVER or ADMIN.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RideId' }]
      requestBody: { $ref: '#/components/requestBodies/RideStart' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/drivers/rides/{id}/complete:
    post:
      tags: [Drivers]
      operationId: completeRide
      summary: Complete the ride, calculate actual fare, and issue the invoice
      description: Roles DRIVER or ADMIN.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RideId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/drivers/rides/{id}/cancel:
    post:
      tags: [Drivers]
      operationId: cancelRideByDriver
      summary: Cancel the assignment and return the ride to matching
      description: Roles DRIVER or ADMIN.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RideId' }]
      requestBody: { $ref: '#/components/requestBodies/Cancel' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/rides/estimate:
    post:
      tags: [Rides]
      operationId: estimateRide
      summary: Estimate route, duration, and fare
      description: Roles CUSTOMER or ADMIN.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/RideEstimate' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/rides:
    post:
      tags: [Rides]
      operationId: createRide
      summary: Book an immediate or scheduled ride
      description: Role CUSTOMER. VIETQR rides include payment.vietQr details in the response.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/RideCreate' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [Rides]
      operationId: listRides
      summary: List rides for the selected customer or driver context
      description: A CUSTOMER or DRIVER role is required; ownership and the selected role context are enforced. An ADMIN-only account has no implicit list scope.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RideContext' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/rides/current:
    get:
      tags: [Rides]
      operationId: getCurrentRide
      summary: Get the current ride for the selected role context
      description: A CUSTOMER or DRIVER role is required. Customer responses expose startPin; VIETQR payment details survive reload.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RideContext' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/rides/{id}/invoice:
    get:
      tags: [Rides]
      operationId: getRideInvoice
      summary: Get the invoice for a completed ride
      description: Ride owners with CUSTOMER or DRIVER, plus ADMIN, OPERATOR, SUPPORT, or ACCOUNTANT roles, may access the invoice.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RideId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/rides/{id}:
    get:
      tags: [Rides]
      operationId: getRide
      summary: Get a ride by ID
      description: Ride owners with CUSTOMER or DRIVER, plus ADMIN, OPERATOR, SUPPORT, or ACCOUNTANT roles, may access it. VIETQR payment details are included when applicable.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RideId' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/rides/{id}/cancel:
    post:
      tags: [Rides]
      operationId: cancelRideByCustomer
      summary: Cancel a ride as its customer
      description: Role CUSTOMER; cancellation fees and wallet releases are applied when applicable.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RideId' }]
      requestBody: { $ref: '#/components/requestBodies/Cancel' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/rides/{id}/rating:
    post:
      tags: [Rides]
      operationId: rateRide
      summary: Rate a completed ride
      description: Role CUSTOMER and ride ownership required.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RideId' }]
      requestBody: { $ref: '#/components/requestBodies/RideRating' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/maps/search:
    get:
      tags: [Maps]
      operationId: searchAddresses
      summary: Search addresses, optionally biased by a coordinate
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, minLength: 3, maxLength: 160 } }
        - { in: query, name: lat, schema: { type: number, minimum: -90, maximum: 90 } }
        - { in: query, name: lng, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
