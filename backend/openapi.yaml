        - { in: query, name: action, schema: { type: string } }
        - { in: query, name: entityType, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Forbidden' } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RideId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    EntityId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    RideContext:
      in: query
      name: as
      description: Select the customer or driver identity when the account has more than one role.
      schema: { type: string, enum: [customer, driver] }
    Search:
      in: query
      name: search
      schema: { type: string }
    Status:
      in: query
      name: status
      schema: { type: string }
    ReviewStatus:
      in: query
      name: status
      schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    ApiSuccess:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: {}
    ApiError:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [phone, fullName, password]
      properties:
        phone: { type: string, minLength: 9, maxLength: 15 }
        fullName: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 6, maxLength: 100 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        phone: { type: string, minLength: 9, maxLength: 15 }
        password: { type: string, format: password, minLength: 6, maxLength: 100 }
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier: { type: string, minLength: 5, maxLength: 191 }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 40, maxLength: 200 }
        password: { type: string, format: password, minLength: 8, maxLength: 100 }
    PushSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri, maxLength: 512 }
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 20, maxLength: 512 }
            auth: { type: string, minLength: 8, maxLength: 512 }
    RemovePushSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [endpoint]
      properties:
        endpoint: { type: string, format: uri, maxLength: 512 }
    EmergencyContactRequest:
      type: object
      additionalProperties: false
      required: [name, phone]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        relationship: { type: string, minLength: 2, maxLength: 80 }
        phone: { type: string, minLength: 9, maxLength: 20 }
        isPrimary: { type: boolean, default: false }
    SosRequest:
      type: object
      additionalProperties: false
      properties:
        rideId: { type: string, format: uuid }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        message: { type: string, maxLength: 500 }
    MessageRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
    SupportTicketRequest:
      type: object
      additionalProperties: false
      required: [subject, description]
      properties:
        rideId: { type: string, format: uuid }
        subject: { type: string, minLength: 3, maxLength: 191 }
        description: { type: string, minLength: 5, maxLength: 5000 }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT], default: MEDIUM }
    SupportTicketUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
        assignedToId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
        resolution: { oneOf: [{ type: string, maxLength: 5000 }, { type: 'null' }] }
    VehicleManageRequest:
      type: object
      properties:
        vehicleTypeId: { type: string, format: uuid }
        plateNumber: { type: string, minLength: 5, maxLength: 20 }
        brand: { type: string, maxLength: 80 }
        model: { type: string, maxLength: 80 }
        color: { type: string, maxLength: 40 }
        isActive: { type: boolean }
    DocumentUploadRequest:
      type: object
      required: [type, fileName, mimeType, fileSize]
      properties:
        type: { type: string, minLength: 2, maxLength: 80 }
        fileName: { type: string, maxLength: 255 }
        mimeType: { type: string, enum: [image/jpeg, image/png, application/pdf] }
        fileSize: { type: integer, minimum: 1, maximum: 10485760 }
        expiresAt: { type: string, format: date-time }
    SendOtpRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone: { type: string, minLength: 9, maxLength: 15 }
    VerifyOtpRequest:
      type: object
      additionalProperties: false
      required: [phone, otp]
      properties:
        phone: { type: string, minLength: 9, maxLength: 15 }
        otp: { type: string, minLength: 6, maxLength: 6 }
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 20 }
    CustomerUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        email:
          oneOf: [{ type: string, format: email }, { type: 'null' }]
        avatarUrl:
          oneOf: [{ type: string, format: uri }, { type: 'null' }]
    AddressCreateRequest:
      type: object
      additionalProperties: false
      required: [label, address, lat, lng]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        address: { type: string, minLength: 5, maxLength: 255 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    DriverRegisterRequest:
      type: object
      additionalProperties: false
      required: [licenseNumber, identityNumber, vehicle]
      properties:
        licenseNumber: { type: string, minLength: 4, maxLength: 40 }
        identityNumber: { type: string, minLength: 6, maxLength: 30 }
        vehicle:
          type: object
          additionalProperties: false
          required: [vehicleTypeId, plateNumber]
          properties:
            vehicleTypeId: { type: string, format: uuid }
            plateNumber: { type: string, minLength: 5, maxLength: 20 }
            brand: { type: string, maxLength: 80 }
            model: { type: string, maxLength: 80 }
            color: { type: string, maxLength: 40 }
    DriverUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        licenseNumber: { type: string, minLength: 4, maxLength: 40 }
        identityNumber: { type: string, minLength: 6, maxLength: 30 }
    LocationUpdateRequest:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        heading: { type: number, minimum: 0, maximum: 360 }
        speed: { type: number, minimum: 0 }
    TopUpCreateRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount: { type: integer, minimum: 10000, maximum: 100000000 }
    WithdrawalCreateRequest:
      type: object
      additionalProperties: false
      required: [amount, bankCode, accountNumber, accountName]
      properties:
        amount: { type: integer, minimum: 50000, maximum: 100000000 }
        bankCode: { type: string, minLength: 2, maxLength: 30 }
        accountNumber: { type: string, pattern: '^\d{6,30}$' }
        accountName: { type: string, minLength: 2, maxLength: 150 }
    Point:
      type: object
      additionalProperties: false
      required: [address, lat, lng]
      properties:
        address: { type: string, minLength: 5 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    Stop:
      allOf:
        - { $ref: '#/components/schemas/Point' }
        - type: object
          properties:
            dwellMinutes: { type: integer, minimum: 1, maximum: 30, default: 5 }
    RideEstimateRequest:
      type: object
      required: [pickup, dropoff, vehicleTypeId]
      properties:
        pickup: { $ref: '#/components/schemas/Point' }
        dropoff: { $ref: '#/components/schemas/Point' }
        stops:
          type: array
          maxItems: 2
          default: []
          items: { $ref: '#/components/schemas/Stop' }
        vehicleTypeId: { type: string, format: uuid }
        promotionCode: { type: string, minLength: 1 }
        scheduledAt: { type: string, format: date-time }
    RideCreateRequest:
      allOf:
        - { $ref: '#/components/schemas/RideEstimateRequest' }
        - type: object
          properties:
            paymentMethod: { type: string, enum: [CASH, CARD, WALLET, VIETQR], default: CASH }
    CancelRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 255 }
    RideStartRequest:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin: { type: string, pattern: '^\d{4}$' }
    RideRatingRequest:
      type: object
      additionalProperties: false
      required: [score]
      properties:
        score: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 500 }
    VietQrIpnRequest:
      type: object
      additionalProperties: false
      required: [transactionId, reference, amount, paidAt, signature]
      properties:
        transactionId: { type: string, minLength: 1, maxLength: 191 }
        reference: { type: string, minLength: 1, maxLength: 50 }
        amount: { type: integer, minimum: 1 }
        paidAt: { type: string, format: date-time }
        signature: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
    RefundCreateRequest:
      type: object
      additionalProperties: false
      required: [amount, reason]
      properties:
        amount: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 191 }
    PromotionValidateRequest:
      type: object
      additionalProperties: false
      required: [code, fare]
      properties:
        code: { type: string, minLength: 1 }
        fare: { type: number, minimum: 0 }
    PromotionFields:
      type: object
      additionalProperties: false
      properties:
        code: { type: string, minLength: 2, maxLength: 40 }
        name: { type: string, minLength: 2, maxLength: 120 }
        type: { type: string, enum: [PERCENTAGE, FIXED_AMOUNT] }
        value: { type: number, minimum: 0 }
        maxDiscount:
          oneOf: [{ type: number, minimum: 0 }, { type: 'null' }]
        minRideFare:
          oneOf: [{ type: number, minimum: 0 }, { type: 'null' }]
        usageLimit:
          oneOf: [{ type: integer, minimum: 1 }, { type: 'null' }]
        perUserLimit:
          oneOf: [{ type: integer, minimum: 1 }, { type: 'null' }]
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        isActive: { type: boolean }
    PromotionCreateRequest:
      allOf:
        - { $ref: '#/components/schemas/PromotionFields' }
        - type: object
          required: [code, name, type, value, startsAt, endsAt]
    PricingRuleFields:
      type: object
      additionalProperties: false
      properties:
        vehicleTypeId: { type: string, format: uuid }
        baseFare: { type: number, minimum: 0 }
        perKmFare: { type: number, minimum: 0 }
        perMinuteFare: { type: number, minimum: 0 }
        minimumFare: { type: number, minimum: 0 }
        waitingFeePerMinute: { type: number, minimum: 0 }
        peakMultiplier: { type: number, minimum: 1 }
        activeFrom: { type: string, format: date-time }
        activeTo:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        isActive: { type: boolean }
    PricingRuleCreateRequest:
      allOf:
        - { $ref: '#/components/schemas/PricingRuleFields' }
        - type: object
          required: [vehicleTypeId, baseFare, perKmFare, perMinuteFare, minimumFare]
    SurchargeRuleFields:
      type: object
      additionalProperties: false
      properties:
        vehicleTypeId:
          oneOf: [{ type: string, format: uuid }, { type: 'null' }]
        name: { type: string, minLength: 2, maxLength: 100 }
        type: { type: string, enum: [PEAK_HOUR, LATE_NIGHT, WEATHER, CUSTOM] }
        multiplier: { type: number, minimum: 1, maximum: 5, default: 1 }
        fixedAmount: { type: integer, minimum: 0, maximum: 10000000, default: 0 }
        startMinute:
          oneOf: [{ type: integer, minimum: 0, maximum: 1439 }, { type: 'null' }]
        endMinute:
          oneOf: [{ type: integer, minimum: 0, maximum: 1439 }, { type: 'null' }]
        daysOfWeek:
          type: array
          maxItems: 7
          items: { type: integer, minimum: 0, maximum: 6 }
        weatherConditions:
          type: array
          maxItems: 3
          items: { type: string, enum: [RAIN, HEAVY_RAIN, FLOOD] }
        activeFrom: { type: string, format: date-time }
        activeTo:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        isActive: { type: boolean }
    SurchargeRuleCreateRequest:
      allOf:
        - { $ref: '#/components/schemas/SurchargeRuleFields' }
        - type: object
          required: [name, type]
    WeatherUpdateRequest:
      type: object
      additionalProperties: false
      required: [weatherCondition]
      properties:
        weatherCondition: { type: string, enum: [NORMAL, RAIN, HEAVY_RAIN, FLOOD] }
    UserStatusUpdateRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, LOCKED, DELETED] }
    RejectRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 255 }
    RejectRefundRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 191 }
    ReconciliationClassification:
      type: string
      enum: [EXACT, UNDERPAID, OVERPAID, REFERENCE_NOT_FOUND, DUPLICATE, EXPIRED]
    ReconciliationResolveRequest:
      type: object
      additionalProperties: false
      required: [action, note]
      properties:
        action: { type: string, enum: [ACCEPT, IGNORE] }
        note: { type: string, minLength: 3, maxLength: 191 }
    VietQrDetails:
      type: object
      required: [provider, reference, amount, bankBin, accountNumber, accountName, qrUrl, expiresAt]
      properties:
        provider: { type: string, const: VIETQR }
        reference: { type: string }
        bankBin: { type: string }
        accountNumber: { type: string }
        accountName: { type: string }
        amount: { type: number, minimum: 0 }
        qrUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    DecimalMoney:
      type: string
      pattern: '^-?\d+(?:\.\d+)?$'
      description: Decimal database amount serialized as a JSON string.
    Payment:
      type: object
      required: [id, rideId, customerId, method, status, amount, authorizedAmount, capturedAmount, refundedAmount, createdAt, updatedAt, vietQr]
      properties:
        id: { type: string, format: uuid }
        rideId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        method: { type: string, enum: [CASH, CARD, WALLET, VIETQR] }
        status: { type: string, enum: [PENDING, AUTHORIZED, PARTIALLY_PAID, PAID, FAILED, VOIDED, REFUND_PENDING, REFUNDED] }
        amount: { $ref: '#/components/schemas/DecimalMoney' }
        authorizedAmount: { $ref: '#/components/schemas/DecimalMoney' }
        capturedAmount: { $ref: '#/components/schemas/DecimalMoney' }
        refundedAmount: { $ref: '#/components/schemas/DecimalMoney' }
        provider:
          oneOf: [{ type: string }, { type: 'null' }]
        providerTransactionId:
          oneOf: [{ type: string }, { type: 'null' }]
        paymentReference:
          oneOf: [{ type: string }, { type: 'null' }]
        expiresAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        paidAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        vietQr:
          oneOf:
            - { $ref: '#/components/schemas/VietQrDetails' }
            - { type: 'null' }
    PaymentSuccess:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: '#/components/schemas/Payment' }
    FinancialTotals:
      type: object
      required: [grossRevenue, refundedRevenue, netRevenue]
      properties:
        grossRevenue:
          type: number
          description: Total payment captured amount.
        refundedRevenue:
          type: number
          minimum: 0
          description: Total completed refund amount.
        netRevenue:
          type: number
          description: grossRevenue minus refundedRevenue; may be negative for a reporting period.
    DailyFinancial:
      allOf:
        - { $ref: '#/components/schemas/FinancialTotals' }
        - type: object
          required: [day]
          properties:
            day: { type: string, format: date }
    RideStatusCount:
      type: object
      required: [status, count]
      properties:
        status: { type: string }
        count: { type: integer, minimum: 0 }
    Dashboard:
      allOf:
        - { $ref: '#/components/schemas/FinancialTotals' }
        - type: object
          required: [dailyFinancials, statusCounts, totalUsers, totalDrivers, onlineDrivers, activeRides, completedRides, cancelledRides, paidTransactions]
          properties:
            dailyFinancials:
              type: array
              minItems: 7
              maxItems: 7
              items: { $ref: '#/components/schemas/DailyFinancial' }
            statusCounts:
              type: array
              items: { $ref: '#/components/schemas/RideStatusCount' }
            totalUsers: { type: integer, minimum: 0 }
            totalDrivers: { type: integer, minimum: 0 }
            onlineDrivers: { type: integer, minimum: 0 }
            activeRides: { type: integer, minimum: 0 }
            completedRides: { type: integer, minimum: 0 }
            cancelledRides: { type: integer, minimum: 0 }
            paidTransactions: { type: integer, minimum: 0 }
    DashboardSuccess:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: '#/components/schemas/Dashboard' }
    RevenueGroup:
      allOf:
        - { $ref: '#/components/schemas/FinancialTotals' }
        - type: object
          required: [count]
          properties:
            count: { type: integer, minimum: 0 }
    RevenueMethodGroup:
      allOf:
        - { $ref: '#/components/schemas/RevenueGroup' }
        - type: object
          required: [method]
          properties:
            method: { type: string, enum: [CASH, CARD, WALLET, VIETQR] }
    RevenueReport:
      type: object
      required: [paid, pending, platformCommission, driverGrossEarnings, byMethod]
      properties:
        paid: { $ref: '#/components/schemas/RevenueGroup' }
        pending:
          type: object
          required: [count, amount]
          properties:
            count: { type: integer, minimum: 0 }
            amount: { type: number, minimum: 0 }
        platformCommission:
          type: object
          required: [count, amount]
          properties:
            count: { type: integer, minimum: 0 }
            amount: { type: number, minimum: 0 }
        driverGrossEarnings: { type: number }
        byMethod:
          type: array
          items: { $ref: '#/components/schemas/RevenueMethodGroup' }
    RevenueReportSuccess:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: '#/components/schemas/RevenueReport' }

  requestBodies:
    Register:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } }
    Login:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
    ForgotPassword:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ForgotPasswordRequest' } } }
    ResetPassword:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ResetPasswordRequest' } } }
    PushSubscription:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscriptionRequest' } } }
    RemovePushSubscription:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RemovePushSubscriptionRequest' } } }
    SendOtp:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SendOtpRequest' } } }
    VerifyOtp:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/VerifyOtpRequest' } } }
    RefreshToken:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RefreshTokenRequest' } } }
    CustomerUpdate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CustomerUpdateRequest' } } }
    AddressCreate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/AddressCreateRequest' } } }
    DriverRegister:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/DriverRegisterRequest' } } }
    DriverUpdate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/DriverUpdateRequest' } } }
    LocationUpdate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/LocationUpdateRequest' } } }
    TopUpCreate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/TopUpCreateRequest' } } }
    WithdrawalCreate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/WithdrawalCreateRequest' } } }
    RideEstimate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RideEstimateRequest' } } }
    RideCreate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RideCreateRequest' } } }
    Cancel:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CancelRequest' } } }
    RideStart:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RideStartRequest' } } }
    RideRating:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RideRatingRequest' } } }
    VietQrIpn:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/VietQrIpnRequest' } } }
    RefundCreate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RefundCreateRequest' } } }
    PromotionValidate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/PromotionValidateRequest' } } }
    PricingRuleCreate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/PricingRuleCreateRequest' } } }
    PricingRuleUpdate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/PricingRuleFields' } } }
    SurchargeRuleCreate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SurchargeRuleCreateRequest' } } }
    SurchargeRuleUpdate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SurchargeRuleFields' } } }
    WeatherUpdate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/WeatherUpdateRequest' } } }
    UserStatusUpdate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/UserStatusUpdateRequest' } } }
    Reject:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RejectRequest' } } }
    RejectRefund:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RejectRefundRequest' } } }
    ReconciliationResolve:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationResolveRequest' } } }
    PromotionCreate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/PromotionCreateRequest' } } }
    PromotionUpdate:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/PromotionFields' } } }

  responses:
    Success:
      description: Successful request
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccess' } } }
    Created:
      description: Resource created
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccess' } } }
    PaymentSuccess:
      description: Ride payment details
      content: { application/json: { schema: { $ref: '#/components/schemas/PaymentSuccess' } } }
    DashboardSuccess:
      description: Dashboard metrics
      content: { application/json: { schema: { $ref: '#/components/schemas/DashboardSuccess' } } }
    RevenueReportSuccess:
      description: Revenue report
      content: { application/json: { schema: { $ref: '#/components/schemas/RevenueReportSuccess' } } }
    Unauthorized:
      description: Missing, expired, or invalid authentication
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Forbidden:
      description: Authenticated user lacks the required role or resource access
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Conflict:
      description: Business-state conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unprocessable:
      description: Request validation or business-rule failure
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    RateLimited:
      description: Request rate limit exceeded
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    ServiceUnavailable:
      description: Required integration is unavailable or not configured
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
