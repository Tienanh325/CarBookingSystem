services:
  mysql:
    image: mysql:8.4
    container_name: ride_booking_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ride_booking
      MYSQL_USER: ride_booking
      MYSQL_PASSWORD: ride_booking
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ride_booking_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: ride_booking_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: goride
      MINIO_ROOT_PASSWORD: replace-this-minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 goride replace-this-minio-password;
      do sleep 2; done;
      mc mb --ignore-existing local/goride-documents"

volumes:
  mysql_data:
  minio_data:
