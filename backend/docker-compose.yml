services:
  mysql:
    image: mysql:8.4
    container_name: ride_booking_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ride_booking
      MYSQL_USER: ride_booking
      MYSQL_PASSWORD: ride_booking
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ride_booking_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
